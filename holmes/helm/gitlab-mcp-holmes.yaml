# Kubernetes resources for the HolmesGPT-restricted GitLab MCP service.
#
# Drop this into your platform Helm chart's templates/ (replace the
# <placeholders>, or template them from values) or apply it with kubectl.
# It deliberately does NOT use the HolmesGPT chart's built-in `mcpAddons.gitlabMcp`
# addon: that addon runs the unpatched upstream package via `npx` inside a
# supergateway image and cannot run this custom image.
#
# Security model (see holmes/README.md):
#   - The GitLab write token lives ONLY in this Deployment's Secret.
#   - Holmes reaches the server over HTTP with a separate shared client token
#     (STREAMABLE_HTTP_AUTH_TOKEN). It never sees the GitLab token.
#   - The NetworkPolicy limits who can talk to this service.
#   - Holmes must not be able to read this namespace's Secrets or exec into
#     this pod (RBAC / no kubectl-secrets toolset) — otherwise the policy can be
#     bypassed by using the GitLab token directly.
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-mcp-holmes-gitlab-token
  namespace: <mcp-namespace>
type: Opaque
stringData:
  # GitLab token with `api` scope (Developer role on the target projects is
  # enough to create branches, commit, and open MRs). Prefer a project or group
  # access token / bot user over a personal token. Manage with your secret
  # store (ExternalSecrets, SealedSecrets, ...) rather than committing it.
  token: <GITLAB_TOKEN>
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-mcp-holmes-client-token
  namespace: <mcp-namespace>
type: Opaque
stringData:
  # Random shared secret presented by Holmes as `Authorization: Bearer ...`.
  # Generate with: openssl rand -hex 32
  # The same value must be available to the Holmes pod (see holmes-values.example.yaml).
  token: <MCP_CLIENT_TOKEN>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-mcp-holmes
  namespace: <mcp-namespace>
  labels:
    app.kubernetes.io/name: gitlab-mcp-holmes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-mcp-holmes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-mcp-holmes
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gitlab-mcp
          # Pin by digest, taken from `holmes/build-image.sh` output.
          image: <registry>/gitlab-mcp-holmes@sha256:<digest>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          env:
            # --- policy (the customization) -------------------------------
            - name: HOLMES_WRITE_POLICY
              value: "true"
            # Defense in depth: upstream also strips its delete tools.
            - name: GITLAB_PERMISSION_MODE
              value: "modify"
            # Only load the toolsets the allowlist draws from; the policy
            # allowlist (utils/holmes-write-policy.ts) prunes these further.
            - name: GITLAB_TOOLSETS
              value: "repositories,branches,merge_requests,projects,search,issues,ci,pipelines,labels,releases,tags,users"
            # Optional: additionally scope to specific projects (comma-separated IDs/paths).
            # - name: GITLAB_ALLOWED_PROJECT_IDS
            #   value: "123,456"
            # --- GitLab -----------------------------------------------------
            - name: GITLAB_API_URL
              value: "https://gitlab.example.com/api/v4"
            - name: GITLAB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitlab-mcp-holmes-gitlab-token
                  key: token
            # Self-signed / private CA (mount the bundle and point to it):
            # - name: GITLAB_CA_CERT_PATH
            #   value: /etc/gitlab-ca/ca.crt
            # --- transport --------------------------------------------------
            - name: STREAMABLE_HTTP
              value: "true"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3002"
            - name: STREAMABLE_HTTP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitlab-mcp-holmes-client-token
                  key: token
            # DNS-rebinding protection: the Host header Holmes will use.
            - name: MCP_SERVER_URL
              value: "http://gitlab-mcp-holmes.<mcp-namespace>.svc.cluster.local:3002"
            - name: MAX_REQUESTS_PER_MINUTE
              value: "600"
            - name: GITLAB_DISABLE_VERSION_CHECK
              value: "true"
            - name: LOG_LEVEL
              value: "info"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-mcp-holmes
  namespace: <mcp-namespace>
spec:
  selector:
    app.kubernetes.io/name: gitlab-mcp-holmes
  ports:
    - name: http
      port: 3002
      targetPort: http
---
# Only the Holmes pods may reach the MCP server; the MCP server may only reach
# GitLab (and DNS). Adjust selectors/CIDRs to your cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitlab-mcp-holmes
  namespace: <mcp-namespace>
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gitlab-mcp-holmes
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <holmes-namespace>
          podSelector:
            matchLabels:
              app: holmes   # match the HolmesGPT chart's pod labels
      ports:
        - port: 3002
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: <gitlab-ip-or-cidr>
      ports:
        - port: 443
