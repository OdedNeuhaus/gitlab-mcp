{{- if .Values.gitlab.personalAccessToken }}
# Chart-managed GitLab token Secret (testing convenience; prefer gitlab.secretName).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitlab-mcp-holmes.gitlabSecretName" . }}
  labels:
    {{- include "gitlab-mcp-holmes.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.gitlab.secretKey }}: {{ .Values.gitlab.personalAccessToken | b64enc }}
{{- end }}
{{- if .Values.mcp.authToken }}
---
# Chart-managed MCP client token Secret (testing convenience; prefer mcp.authSecretName).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitlab-mcp-holmes.mcpAuthSecretName" . }}
  labels:
    {{- include "gitlab-mcp-holmes.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.mcp.authSecretKey }}: {{ .Values.mcp.authToken | b64enc }}
{{- end }}
