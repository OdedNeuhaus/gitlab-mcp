{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gitlab-mcp-holmes.fullname" . }}
  labels:
    {{- include "gitlab-mcp-holmes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gitlab-mcp-holmes.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress | nindent 8 }}
      ports:
        - port: 3002
          protocol: TCP
  {{- if .Values.networkPolicy.egress }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- end }}
{{- end }}
