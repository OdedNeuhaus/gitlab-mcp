# `helm test <release>`: the server is up and rejects unauthenticated MCP calls.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "gitlab-mcp-holmes.fullname" . }}-test
  labels:
    {{- include "gitlab-mcp-holmes.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: curlimages/curl:8.10.1
      command: ["sh", "-ec"]
      args:
        - |
          base="http://{{ include "gitlab-mcp-holmes.fullname" . }}:{{ .Values.service.port }}"
          curl -fsS "$base/health"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/mcp" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"helm-test","version":"0"}}}')
          echo "unauthenticated /mcp -> $code"
          [ "$code" = "401" ]
